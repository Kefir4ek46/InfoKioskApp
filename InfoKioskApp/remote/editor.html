<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoKiosk Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>✍️ Панель редактора</h1>
      <p class="subtitle">Создайте новость, добавьте фото/видео и отправьте на модерацию</p>
    </div>
  </header>

  <div id="editor-auth-modal" class="post-modal hidden">
    <div class="post-modal-content" style="max-width:520px;">
      <h2>Вход редактора</h2>
      <label>Логин</label>
      <input id="editor-login-modal" type="text">
      <label>Имя (для отображения)</label>
      <input id="editor-name-modal" type="text" readonly>
      <label>Пароль</label>
      <input id="editor-password-modal" type="password">
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button onclick="loginEditorFromModal()">Войти</button>
      </div>
      <p id="editor-auth-modal-status" class="hint"></p>
    </div>
  </div>

  <main>
    <section class="tab-content active">
      <div class="grid-2">
        <div class="card">
          <h3>Профиль редактора</h3>
          <label>Логин</label>
          <input id="editor-login" type="text" readonly>
          <label>Имя</label>
          <input id="editor-name" type="text" readonly>
          <p id="editor-auth-status" class="hint"></p>

          <h4 style="margin-top:14px;">Смена пароля</h4>
          <label>Текущий пароль</label>
          <input id="editor-old-password" type="password">
          <label>Новый пароль</label>
          <input id="editor-new-password" type="password">
          <button onclick="changeEditorPassword()">🔐 Сменить пароль</button>
        </div>

        <div class="card">
          <h3>Новая новость</h3>
          <label>Заголовок</label>
          <input id="news-title" type="text">
          <label>Текст новости</label>
          <textarea id="news-content"></textarea>
                    <label>Ссылка к новости (для QR-кода)</label>
          <input id="news-link-url" type="text" placeholder="https://...">
          <label>Или прикрепить видеофайл</label>
          <input id="news-video-file" type="file" accept="video/*">
          <label>Фото (можно несколько)</label>
          <input id="news-photos" type="file" accept="image/*" multiple>
          <button onclick="submitNews()">📤 Отправить на модерацию</button>
        </div>
      </div>

      <div class="card">
        <h3>Мои отправленные новости</h3>
        <button onclick="loadMyPending()">🔄 Обновить</button>
        <ul id="my-news-list"></ul>
      </div>
    </section>
  </main>

  <script src="editor.js"></script>
</body>
</html>
