<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoKiosk — Выбор роли</title>
  <link rel="stylesheet" href="/shared/style.css">
  <style>
    /* Стили только для страницы выбора роли */
    .role-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #2a2a2a 0%, #1E1E1E 60%);
      padding: 24px;
      box-sizing: border-box;
    }
    .role-card {
      max-width: 720px;
      width: 100%;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      animation: fade-up .5s ease;
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .role-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin-bottom: 8px;
    }
    .role-logo h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -.5px;
      margin: 0;
    }
    .role-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
      margin: 4px 0 32px;
    }
    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    @media (max-width: 600px) {
      .role-grid { grid-template-columns: 1fr; }
      .role-card { padding: 32px 20px; }
    }
    .role-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 32px 20px;
      border-radius: 14px;
      background: var(--bg);
      border: 2px solid var(--border);
      color: var(--text);
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
      cursor: pointer;
    }
    .role-tile:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      background: var(--panel-2);
      box-shadow: 0 12px 30px rgba(58,159,255,.18);
    }
    .role-tile:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .role-tile-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    .role-tile.admin .role-tile-icon  { background: linear-gradient(135deg, #3A9FFF 0%, #2A82DA 100%); }
    .role-tile.editor .role-tile-icon { background: linear-gradient(135deg, #28A745 0%, #1E7E34 100%); }
    .role-tile-title {
      font-size: 18px;
      font-weight: 600;
    }
    .role-tile-desc {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }
    .role-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .role-footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .role-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body class="theme-dark">

  <div class="role-screen">
    <div class="role-card">
      <div class="role-logo">
        <svg viewBox="0 0 40 40" width="44" height="44">
          <rect x="3" y="6" width="34" height="26" rx="3" fill="#3A9FFF"/>
          <rect x="3" y="6" width="34" height="6"  rx="3" fill="#2A82DA"/>
          <circle cx="9"  cy="9" r="1.5" fill="#1E1E1E"/>
          <circle cx="14" cy="9" r="1.5" fill="#1E1E1E"/>
          <text x="20" y="24" text-anchor="middle" font-family="Roboto, sans-serif" font-weight="700" font-size="12" fill="#fff">ШК</text>
        </svg>
        <h1>InfoKiosk</h1>
      </div>
      <p class="role-subtitle">Выберите роль для входа в систему</p>

      <div class="role-grid">
        <a href="/admin" class="role-tile admin">
          <div class="role-tile-icon">A</div>
          <div class="role-tile-title">Администратор</div>
          <div class="role-tile-desc">Полный доступ: модерация новостей, файлы, календарь, настройки киоска</div>
        </a>
        <a href="/editor" class="role-tile editor">
          <div class="role-tile-icon">Р</div>
          <div class="role-tile-title">Редактор новостей</div>
          <div class="role-tile-desc">Подача новостей на модерацию, просмотр своих опубликованных материалов</div>
        </a>
      </div>

      <div class="role-footer">
        Доступ к киоску — только с локального устройства.
      </div>
    </div>
  </div>

</body>
</html>
