<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoKiosk Remote Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🌐 InfoKiosk Remote Admin</h1>
        <p id="server-status">🔄 Подключение...</p>
    </header>

    <main>
        <section>
            <h2>📂 Файлы и расписания</h2>
            <div class="upload-block">
                <label>Тип загрузки:</label>
                <select id="upload-type">
                    <option value="main">Основное расписание</option>
                    <option value="changes">Изменённое расписание</option>
                    <option value="schedules">Другое расписание</option>
                    <option value="media">Медиа</option>
                    <option value="docs">Документы</option>
                </select>

                <input type="file" id="file-input">
                <button onclick="uploadFile()">⬆ Загрузить</button>
            </div>

            <div class="file-list">
                <button onclick="loadFileList()">🔄 Обновить список</button>
                <ul id="files"></ul>
            </div>
        </section>

        <section>
            <h2>📅 Календарь событий</h2>
            <div class="calendar-form">
                <input id="event-title" placeholder="Название события">
                <input id="event-date" type="date">
                <button onclick="addEvent()">➕ Добавить</button>
            </div>
            <ul id="calendar"></ul>
        </section>
    </main>

    <footer>
        <p>© InfoKioskApp Remote Interface</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
